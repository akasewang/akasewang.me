name: Security Audit

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-audit.yml
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit
